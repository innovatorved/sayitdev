<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Chatbot — On-Device Intelligence</title>
  <style>
    /* ═══════════════════════════════════════════════════════════════
       Design Tokens & Themes — innovatorved/chatbot (shadcn/ui + Tailwind)
       ═══════════════════════════════════════════════════════════════ */
    :root {
      --background: 0 0% 100%;
      --foreground: 0 0% 9%;
      --card: 0 0% 100%;
      --card-foreground: 0 0% 9%;
      --popover: 0 0% 100%;
      --popover-foreground: 0 0% 9%;
      --primary: 0 0% 9%;
      --primary-foreground: 0 0% 98%;
      --secondary: 0 0% 96.1%;
      --secondary-foreground: 0 0% 9%;
      --muted: 0 0% 96.1%;
      --muted-foreground: 0 0% 45.1%;
      --accent: 0 0% 96.1%;
      --accent-foreground: 0 0% 9%;
      --destructive: 0 84.2% 60.2%;
      --destructive-foreground: 0 0% 98%;
      --border: 0 0% 89.8%;
      --input: 0 0% 89.8%;
      --ring: 0 0% 3.9%;
      --radius: 0.75rem;

      --sidebar-background: 0 0% 98%;
      --sidebar-foreground: 0 0% 26.1%;
      --sidebar-border: 0 0% 92%;
      --sidebar-accent: 0 0% 96.1%;
      --sidebar-accent-foreground: 0 0% 9%;

      --font-sans: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      --font-mono: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", "Courier New", monospace;
    }

    .dark {
      --background: 0 0% 10%;
      --foreground: 0 0% 95%;
      --card: 0 0% 10%;
      --card-foreground: 0 0% 95%;
      --popover: 0 0% 10%;
      --popover-foreground: 0 0% 95%;
      --primary: 0 0% 95%;
      --primary-foreground: 0 0% 10%;
      --secondary: 0 0% 14.9%;
      --secondary-foreground: 0 0% 95%;
      --muted: 0 0% 14.9%;
      --muted-foreground: 0 0% 63.9%;
      --accent: 0 0% 14.9%;
      --accent-foreground: 0 0% 95%;
      --destructive: 0 62.8% 30.6%;
      --destructive-foreground: 0 0% 95%;
      --border: 0 0% 20%;
      --input: 0 0% 20%;
      --ring: 0 0% 83.1%;

      --sidebar-background: 0 0% 12%;
      --sidebar-foreground: 0 0% 95%;
      --sidebar-border: 0 0% 18%;
      --sidebar-accent: 0 0% 18%;
      --sidebar-accent-foreground: 0 0% 95%;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      height: 100%;
      background-color: hsl(var(--background));
      color: hsl(var(--foreground));
      font-family: var(--font-sans);
      overflow: hidden;
      -webkit-font-smoothing: antialiased;
    }

    /* ── App Layout ────────────────────────────────────────────── */
    #app {
      display: flex;
      height: 100vh;
      width: 100vw;
      position: relative;
    }

    /* ── Sidebar (from app-sidebar.tsx & sidebar-history.tsx) ──── */
    #sidebar {
      width: 256px;
      background-color: hsl(var(--sidebar-background));
      border-right: 1px solid hsl(var(--sidebar-border));
      display: flex;
      flex-direction: column;
      flex-shrink: 0;
      transition: width 0.2s cubic-bezier(0.4, 0, 0.2, 1), transform 0.2s cubic-bezier(0.4, 0, 0.2, 1);
      z-index: 40;
      height: 100%;
    }

    #sidebar.collapsed {
      width: 0;
      overflow: hidden;
      border-right-width: 0;
    }

    .sidebar-header {
      padding: 12px 14px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 1px solid hsl(var(--sidebar-border));
      min-height: 52px;
    }

    .sidebar-brand {
      display: flex;
      align-items: center;
      gap: 8px;
      text-decoration: none;
      color: hsl(var(--foreground));
      font-weight: 600;
      font-size: 16px;
      padding: 4px 8px;
      border-radius: 6px;
      transition: background 0.15s;
    }
    .sidebar-brand:hover {
      background-color: hsl(var(--sidebar-accent));
    }

    .btn-new-chat {
      background: transparent;
      border: none;
      color: hsl(var(--sidebar-foreground));
      cursor: pointer;
      padding: 6px 8px;
      border-radius: 6px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      transition: background 0.15s;
    }
    .btn-new-chat:hover {
      background-color: hsl(var(--sidebar-accent));
      color: hsl(var(--sidebar-accent-foreground));
    }

    .sidebar-history {
      flex: 1;
      overflow-y: auto;
      padding: 10px 8px;
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .history-group-title {
      font-size: 12px;
      font-weight: 500;
      color: hsl(var(--muted-foreground));
      padding: 8px 8px 4px;
    }

    .history-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 8px 10px;
      border-radius: 8px;
      font-size: 13px;
      color: hsl(var(--sidebar-foreground));
      cursor: pointer;
      transition: background 0.15s, color 0.15s;
      user-select: none;
      position: relative;
    }
    .history-item:hover {
      background-color: hsl(var(--sidebar-accent));
      color: hsl(var(--sidebar-accent-foreground));
    }
    .history-item.active {
      background-color: hsl(var(--sidebar-accent));
      color: hsl(var(--sidebar-accent-foreground));
      font-weight: 500;
    }
    .history-item-title {
      flex: 1;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .history-item-del {
      opacity: 0;
      background: none;
      border: none;
      color: hsl(var(--muted-foreground));
      cursor: pointer;
      padding: 2px 4px;
      border-radius: 4px;
    }
    .history-item:hover .history-item-del {
      opacity: 1;
    }
    .history-item-del:hover {
      color: hsl(var(--destructive));
    }

    .sidebar-footer {
      padding: 12px 14px;
      border-top: 1px solid hsl(var(--sidebar-border));
      font-size: 12px;
      color: hsl(var(--muted-foreground));
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    /* ── Main Chat Area (chat.tsx) ─────────────────────────────── */
    #main {
      flex: 1;
      display: flex;
      flex-direction: column;
      height: 100vh;
      overflow: hidden;
      background-color: hsl(var(--background));
      position: relative;
    }

    /* ── Header (chat-header.tsx) ──────────────────────────────── */
    .chat-header {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 6px 12px;
      border-bottom: 1px solid hsl(var(--border));
      background-color: hsl(var(--background));
      position: sticky;
      top: 0;
      z-index: 20;
      min-height: 52px;
    }

    .header-btn {
      background: transparent;
      border: 1px solid hsl(var(--border));
      color: hsl(var(--foreground));
      border-radius: 8px;
      padding: 6px 8px;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      font-size: 13px;
      transition: background 0.15s;
    }
    .header-btn:hover {
      background-color: hsl(var(--muted));
    }

    .model-badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-size: 12px;
      color: hsl(var(--muted-foreground));
      border: 1px solid hsl(var(--border));
      padding: 4px 10px;
      border-radius: 8px;
      background-color: hsl(var(--background));
      font-weight: 500;
    }

    .header-right {
      margin-left: auto;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .status-dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background-color: #10b981;
      display: inline-block;
    }
    .status-dot.offline {
      background-color: hsl(var(--destructive));
    }

    /* ── Messages Container (messages.tsx & message.tsx) ──────── */
    .messages-scroll {
      flex: 1;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      scroll-behavior: smooth;
    }

    .messages-wrap {
      width: 100%;
      max-width: 48rem; /* max-w-3xl */
      margin: 0 auto;
      display: flex;
      flex-direction: column;
      gap: 24px;
      padding: 24px 16px 80px;
    }

    .message-row {
      display: flex;
      gap: 12px;
      width: 100%;
      align-items: flex-start;
      animation: fadeIn 0.2s ease-out;
    }

    .message-row.user {
      flex-direction: row-reverse;
    }

    .bot-avatar {
      width: 28px;
      height: 28px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      color: hsl(var(--muted-foreground));
      margin-top: 2px;
    }

    .message-content-col {
      display: flex;
      flex-direction: column;
      gap: 8px;
      min-width: 0;
    }

    .message-row.user .message-content-col {
      align-items: flex-end;
      max-width: 85%;
      margin-left: auto;
    }

    .message-row.assistant .message-content-col {
      width: 100%;
    }

    /* User Bubble — Exactly matching innovatorved/chatbot:
       bg-primary text-primary-foreground px-4 py-3 rounded-4xl w-fit */
    .user-bubble {
      background-color: hsl(var(--primary));
      color: hsl(var(--primary-foreground));
      padding: 12px 16px;
      border-radius: 2rem; /* rounded-4xl */
      width: fit-content;
      font-size: 15px;
      line-height: 1.5;
      word-break: break-word;
    }

    /* Assistant Content — text-foreground w-full */
    .assistant-content {
      color: hsl(var(--foreground));
      font-size: 15px;
      line-height: 1.65;
      word-break: break-word;
      width: 100%;
    }

    /* Attachments Preview in Message (preview-attachment.tsx) */
    .message-attachment-thumb {
      max-width: 280px;
      max-height: 220px;
      border-radius: 1rem;
      border: 1px solid hsl(var(--border));
      object-fit: cover;
      margin-bottom: 4px;
      display: block;
      cursor: zoom-in;
    }

    /* Message Actions (Copy, TTS) */
    .message-actions {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 12px;
      color: hsl(var(--muted-foreground));
      padding-top: 4px;
    }

    .action-btn {
      background: transparent;
      border: none;
      color: hsl(var(--muted-foreground));
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 4px;
      padding: 3px 6px;
      border-radius: 6px;
      transition: background 0.15s, color 0.15s;
    }
    .action-btn:hover {
      background-color: hsl(var(--muted));
      color: hsl(var(--foreground));
    }

    /* Markdown Styling */
    .prose p { margin-bottom: 12px; }
    .prose p:last-child { margin-bottom: 0; }
    .prose h1, .prose h2, .prose h3 {
      font-weight: 600;
      margin-top: 18px;
      margin-bottom: 8px;
      color: hsl(var(--foreground));
    }
    .prose ul, .prose ol {
      padding-left: 20px;
      margin-bottom: 12px;
    }
    .prose li { margin-bottom: 4px; }
    .prose code {
      font-family: var(--font-mono);
      font-size: 13px;
      background-color: hsl(var(--muted));
      padding: 2px 6px;
      border-radius: 4px;
    }
    .prose pre {
      background-color: hsl(var(--muted));
      border: 1px solid hsl(var(--border));
      border-radius: 12px;
      padding: 12px 14px;
      overflow-x: auto;
      margin: 12px 0;
      position: relative;
    }
    .prose pre code {
      background: none;
      padding: 0;
      border-radius: 0;
      font-size: 13px;
      color: hsl(var(--foreground));
    }
    .code-copy-btn {
      position: absolute;
      top: 8px;
      right: 8px;
      background: hsl(var(--background));
      border: 1px solid hsl(var(--border));
      color: hsl(var(--muted-foreground));
      font-size: 11px;
      padding: 3px 7px;
      border-radius: 6px;
      cursor: pointer;
    }
    .code-copy-btn:hover {
      color: hsl(var(--foreground));
    }

    /* ── Suggested Actions (suggested-actions.tsx) ─────────────── */
    .suggested-actions-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 8px;
      width: 100%;
      max-width: 48rem;
      margin: 0 auto 16px;
      padding: 0 16px;
    }

    .suggested-action-btn {
      text-align: left;
      border: 1px solid hsl(var(--border));
      border-radius: 1rem; /* rounded-2xl */
      padding: 12px 16px;
      font-size: 14px;
      display: flex;
      flex-direction: column;
      gap: 2px;
      background-color: transparent;
      color: hsl(var(--foreground));
      cursor: pointer;
      transition: background-color 0.15s;
    }
    .suggested-action-btn:hover {
      background-color: hsla(var(--accent) / 0.5);
    }
    .suggested-action-title {
      font-weight: 500;
      color: hsl(var(--foreground));
    }
    .suggested-action-label {
      font-size: 12px;
      color: hsl(var(--muted-foreground));
    }

    /* ── Multimodal Input (multimodal-input.tsx) ────────────────── */
    .input-form-container {
      width: 100%;
      max-width: 48rem; /* max-w-3xl */
      margin: 0 auto;
      padding: 0 16px 16px;
      position: relative;
    }

    .input-form-container.centered {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      padding-bottom: 0;
    }

    .attachments-preview-row {
      display: flex;
      flex-direction: row;
      gap: 8px;
      overflow-x: auto;
      align-items: flex-end;
      margin-bottom: 8px;
    }

    .preview-attachment-chip {
      position: relative;
      display: inline-flex;
      align-items: center;
      background-color: hsl(var(--muted));
      border: 1px solid hsl(var(--border));
      border-radius: 12px;
      padding: 4px;
    }
    .preview-attachment-img {
      width: 48px;
      height: 48px;
      border-radius: 8px;
      object-fit: cover;
    }
    .preview-attachment-del {
      position: absolute;
      top: -6px;
      right: -6px;
      width: 18px;
      height: 18px;
      border-radius: 50%;
      background-color: hsl(var(--foreground));
      color: hsl(var(--background));
      border: none;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 11px;
    }

    .input-relative-wrap {
      position: relative;
      width: 100%;
    }

    /* Textarea — Exactly matching innovatorved/chatbot:
       rounded-3xl text-base bg-muted pl-20 pr-24 py-3.5 border-2 border-border */
    .multimodal-textarea {
      width: 100%;
      min-height: 52px;
      max-height: calc(75dvh);
      overflow-y: auto;
      resize: none;
      border-radius: 1.5rem; /* rounded-3xl */
      font-size: 16px;
      background-color: hsl(var(--muted));
      color: hsl(var(--foreground));
      padding: 14px 96px 14px 80px; /* pl-20 pr-24 py-3.5 */
      border: 2px solid hsl(var(--border));
      outline: none;
      font-family: inherit;
      line-height: 1.5;
      transition: border-color 0.15s;
    }
    .multimodal-textarea:focus {
      border-color: hsl(var(--ring));
    }
    .multimodal-textarea.expanded-hero {
      min-height: 120px;
    }

    /* Left controls inside textarea: Attachment + Mic */
    .input-left-controls {
      position: absolute;
      left: 8px;
      top: 50%;
      transform: translateY(-50%);
      display: flex;
      align-items: center;
      gap: 4px;
    }

    .icon-button {
      height: 32px;
      width: 32px;
      padding: 0;
      border-radius: 8px;
      background: transparent;
      border: none;
      color: hsl(var(--muted-foreground));
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      transition: color 0.15s, background-color 0.15s;
    }
    .icon-button:hover {
      background-color: hsl(var(--accent));
      color: hsl(var(--foreground));
    }
    .icon-button.recording {
      color: hsl(var(--destructive));
      background-color: hsla(var(--destructive) / 0.15);
      animation: pulse 1.2s infinite;
    }

    /* Right controls inside textarea: Model selector + Send button */
    .input-right-controls {
      position: absolute;
      right: 8px;
      top: 50%;
      transform: translateY(-50%);
      display: flex;
      align-items: center;
      gap: 4px;
    }

    .send-button {
      height: 32px;
      width: 32px;
      padding: 0;
      border-radius: 8px;
      background-color: hsl(var(--foreground));
      color: hsl(var(--background));
      border: none;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: opacity 0.15s, background-color 0.15s;
    }
    .send-button:hover {
      background-color: hsla(var(--foreground) / 0.9);
    }
    .send-button:disabled {
      opacity: 0.3;
      cursor: not-allowed;
    }

    .stop-button {
      height: 32px;
      width: 32px;
      padding: 0;
      border-radius: 8px;
      background-color: hsl(var(--foreground));
      color: hsl(var(--background));
      border: none;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
    }

    .cursor {
      display: inline-block;
      width: 6px;
      height: 15px;
      background-color: hsl(var(--foreground));
      vertical-align: text-bottom;
      margin-left: 2px;
      animation: blink 0.8s infinite;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(4px); }
      to { opacity: 1; transform: translateY(0); }
    }
    @keyframes pulse {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.08); }
    }
    @keyframes blink {
      0%, 100% { opacity: 1; }
      50% { opacity: 0; }
    }

    @media (max-width: 640px) {
      .suggested-actions-grid {
        grid-template-columns: 1fr;
      }
      #sidebar {
        position: absolute;
        top: 0;
        bottom: 0;
        left: 0;
        transform: translateX(0);
      }
      #sidebar.collapsed {
        transform: translateX(-100%);
        width: 256px;
      }
    }
  </style>
</head>
<body>

<div id="app">
  <!-- Left Sidebar (app-sidebar.tsx) -->
  <aside id="sidebar">
    <div class="sidebar-header">
      <a href="/" class="sidebar-brand">
        <!-- BotIcon from icons.tsx -->
        <svg height="18" viewBox="0 0 16 16" width="18" fill="currentColor">
          <path fill-rule="evenodd" clip-rule="evenodd" d="M8.75 2.79933C9.19835 2.53997 9.5 2.05521 9.5 1.5C9.5 0.671573 8.82843 0 8 0C7.17157 0 6.5 0.671573 6.5 1.5C6.5 2.05521 6.80165 2.53997 7.25 2.79933V5H7C4.027 5 1.55904 7.16229 1.08296 10H0V13H1V14.5V16H2.5H13.5H15V14.5V13H16V10H14.917C14.441 7.16229 11.973 5 9 5H8.75V2.79933ZM7 6.5C4.51472 6.5 2.5 8.51472 2.5 11V14.5H13.5V11C13.5 8.51472 11.4853 6.5 9 6.5H7ZM7.25 11.25C7.25 12.2165 6.4665 13 5.5 13C4.5335 13 3.75 12.2165 3.75 11.25C3.75 10.2835 4.5335 9.5 5.5 9.5C6.4665 9.5 7.25 10.2835 7.25 11.25ZM10.5 13C11.4665 13 12.25 12.2165 12.25 11.25C12.25 10.2835 11.4665 9.5 10.5 9.5C9.5335 9.5 8.75 10.2835 8.75 11.25C8.75 12.2165 9.5335 13 10.5 13Z"/>
        </svg>
        <span>Chatbot</span>
      </a>
      <button class="btn-new-chat" id="sidebar-new-chat-btn" title="New Chat">
        <!-- PlusIcon from icons.tsx -->
        <svg height="16" viewBox="0 0 16 16" width="16" fill="currentColor">
          <path d="M8.75 3.75a.75.75 0 0 0-1.5 0v3.5h-3.5a.75.75 0 0 0 0 1.5h3.5v3.5a.75.75 0 0 0 1.5 0v-3.5h3.5a.75.75 0 0 0 0-1.5h-3.5v-3.5Z"/>
        </svg>
      </button>
    </div>

    <div class="sidebar-history" id="sidebar-history"></div>

    <div class="sidebar-footer">
      <div style="display:flex; align-items:center; gap:6px;">
        <span class="status-dot" id="server-status-dot"></span>
        <span style="font-weight:500;">Apple Intelligence</span>
      </div>
      <div>100% On-Device &bull; Local Neural Engine</div>
    </div>
  </aside>

  <!-- Main Content (chat.tsx) -->
  <main id="main">
    <!-- Chat Header (chat-header.tsx) -->
    <header class="chat-header">
      <!-- SidebarToggle button with MenuIcon -->
      <button class="header-btn" id="sidebar-toggle-btn" title="Toggle Sidebar">
        <svg height="16" viewBox="0 0 16 16" width="16" fill="currentColor">
          <path fill-rule="evenodd" clip-rule="evenodd" d="M1 2H1.75H14.25H15V3.5H14.25H1.75H1V2ZM1 12.5H1.75H14.25H15V14H14.25H1.75H1V12.5ZM1.75 7.25H1V8.75H1.75H14.25H15V7.25H14.25H1.75Z"/>
        </svg>
      </button>

      <button class="header-btn" id="header-new-chat-btn" title="New Chat">
        <svg height="16" viewBox="0 0 16 16" width="16" fill="currentColor">
          <path d="M8.75 3.75a.75.75 0 0 0-1.5 0v3.5h-3.5a.75.75 0 0 0 0 1.5h3.5v3.5a.75.75 0 0 0 1.5 0v-3.5h3.5a.75.75 0 0 0 0-1.5h-3.5v-3.5Z"/>
        </svg>
        <span>New Chat</span>
      </button>

      <div class="header-right">
        <div class="model-badge">
          <span class="status-dot" id="header-status-dot"></span>
          <span id="model-name-label">FoundationModels</span>
        </div>
        <button class="header-btn" id="theme-toggle-btn" title="Toggle Theme">
          <svg height="16" viewBox="0 0 24 24" width="16" fill="none" stroke="currentColor" stroke-width="2">
            <circle cx="12" cy="12" r="5"></circle>
            <line x1="12" y1="1" x2="12" y2="3"></line>
            <line x1="12" y1="21" x2="12" y2="23"></line>
            <line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line>
            <line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line>
            <line x1="1" y1="12" x2="3" y2="12"></line>
            <line x1="21" y1="12" x2="23" y2="12"></line>
            <line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line>
            <line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line>
          </svg>
        </button>
      </div>
    </header>

    <!-- Scrollable Messages Area -->
    <div class="messages-scroll" id="messages-scroll">
      <div class="messages-wrap" id="messages-wrap"></div>
    </div>

    <!-- Suggested Actions (suggested-actions.tsx) -->
    <div class="suggested-actions-grid" id="suggested-actions-grid">
      <button class="suggested-action-btn" onclick="useSuggestedAction('What are the advantages of using on-device AI?')">
        <span class="suggested-action-title">What are the advantages</span>
        <span class="suggested-action-label">of using on-device AI?</span>
      </button>
      <button class="suggested-action-btn" onclick="useSuggestedAction('Write a Swift actor that handles concurrent jobs with TaskGroup.')">
        <span class="suggested-action-title">Write a Swift actor</span>
        <span class="suggested-action-label">with TaskGroup strict concurrency</span>
      </button>
      <button class="suggested-action-btn" onclick="useSuggestedAction('Describe this image in detail and extract all visible text.')">
        <span class="suggested-action-title">Vision and OCR analysis</span>
        <span class="suggested-action-label">extract text or describe diagram</span>
      </button>
      <button class="suggested-action-btn" onclick="useSuggestedAction('Show 5 practical shell one-liners using jq and xargs.')">
        <span class="suggested-action-title">UNIX pipelines</span>
        <span class="suggested-action-label">using jq and shell scripts</span>
      </button>
    </div>

    <!-- Input Form (multimodal-input.tsx) -->
    <form class="input-form-container" id="input-form-container" onsubmit="event.preventDefault(); submitChat();">
      <!-- Attachments Preview -->
      <div class="attachments-preview-row" id="attachments-preview-row" style="display:none;">
        <div class="preview-attachment-chip">
          <img id="attachment-img-preview" class="preview-attachment-img" src="" alt="preview" />
          <button type="button" class="preview-attachment-del" id="attachment-del-btn" title="Remove attachment">&times;</button>
        </div>
      </div>

      <div class="input-relative-wrap">
        <input type="file" id="file-picker" accept="image/*" style="display:none;" />
        
        <textarea
          class="multimodal-textarea"
          id="chat-input"
          placeholder="Message Chatbot..."
          rows="1"
          autofocus
        ></textarea>

        <!-- Left Controls: Paperclip + Mic -->
        <div class="input-left-controls">
          <button type="button" class="icon-button" id="attach-btn" title="Attach image">
            <!-- PaperclipIcon from icons.tsx -->
            <svg height="18" viewBox="0 0 16 16" width="18" fill="currentColor" style="transform: rotate(-45deg);">
              <path fill-rule="evenodd" clip-rule="evenodd" d="M10.8591 1.70735C10.3257 1.70735 9.81417 1.91925 9.437 2.29643L3.19455 8.53886C2.56246 9.17095 2.20735 10.0282 2.20735 10.9222C2.20735 11.8161 2.56246 12.6734 3.19455 13.3055C3.82665 13.9376 4.68395 14.2927 5.57786 14.2927C6.47178 14.2927 7.32908 13.9376 7.96117 13.3055L14.2036 7.06304L14.7038 6.56287L15.7041 7.56321L15.204 8.06337L8.96151 14.3058C8.06411 15.2032 6.84698 15.7074 5.57786 15.7074C4.30875 15.7074 3.09162 15.2032 2.19422 14.3058C1.29682 13.4084 0.792664 12.1913 0.792664 10.9222C0.792664 9.65305 1.29682 8.43592 2.19422 7.53852L8.43666 1.29609C9.07914 0.653606 9.95054 0.292664 10.8591 0.292664C11.7678 0.292664 12.6392 0.653606 13.2816 1.29609C13.9241 1.93857 14.2851 2.80997 14.2851 3.71857C14.2851 4.62718 13.9241 5.49858 13.2816 6.14106L13.2814 6.14133L7.0324 12.3835C7.03231 12.3836 7.03222 12.3837 7.03213 12.3838C6.64459 12.7712 6.11905 12.9888 5.57107 12.9888C5.02297 12.9888 4.49731 12.7711 4.10974 12.3835C3.72217 11.9959 3.50444 11.4703 3.50444 10.9222C3.50444 10.3741 3.72217 9.8484 4.10974 9.46084L4.11004 9.46054L9.877 3.70039L10.3775 3.20051L11.3772 4.20144L10.8767 4.70131L5.11008 10.4612C5.11005 10.4612 5.11003 10.4612 5.11 10.4613C4.98779 10.5835 4.91913 10.7493 4.91913 10.9222C4.91913 11.0951 4.98782 11.2609 5.11008 11.3832C5.23234 11.5054 5.39817 11.5741 5.57107 11.5741C5.74398 11.5741 5.9098 11.5054 6.03206 11.3832L6.03233 11.3829L12.2813 5.14072C12.2814 5.14063 12.2815 5.14054 12.2816 5.14045C12.6586 4.7633 12.8704 4.25185 12.8704 3.71857C12.8704 3.18516 12.6585 2.6736 12.2813 2.29643C11.9041 1.91925 11.3926 1.70735 10.8591 1.70735Z"/>
            </svg>
          </button>
          <button type="button" class="icon-button" id="mic-btn" title="Voice dictation">
            <!-- Mic icon -->
            <svg height="18" viewBox="0 0 24 24" width="18" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M12 1a3 3 0 0 0-3 3v8a3 3 0 0 0 6 0V4a3 3 0 0 0-3-3z"></path>
              <path d="M19 10v2a7 7 0 0 1-14 0v-2"></path>
              <line x1="12" y1="19" x2="12" y2="23"></line>
              <line x1="8" y1="23" x2="16" y2="23"></line>
            </svg>
          </button>
        </div>

        <!-- Right Controls: Send / Stop -->
        <div class="input-right-controls">
          <button type="button" class="stop-button" id="stop-btn" title="Stop" style="display:none;">
            <!-- StopIcon from icons.tsx -->
            <svg height="16" viewBox="0 0 16 16" width="16" fill="currentColor">
              <path fill-rule="evenodd" clip-rule="evenodd" d="M3 3H13V13H3V3Z"/>
            </svg>
          </button>
          <button type="submit" class="send-button" id="send-btn" title="Send message" disabled>
            <!-- ArrowUpIcon from icons.tsx -->
            <svg height="16" viewBox="0 0 16 16" width="16" fill="currentColor">
              <path fill-rule="evenodd" clip-rule="evenodd" d="M8.70711 1.39644C8.31659 1.00592 7.68342 1.00592 7.2929 1.39644L2.21968 6.46966L1.68935 6.99999L2.75001 8.06065L3.28034 7.53032L7.25001 3.56065V14.25V15H8.75001V14.25V3.56065L12.7197 7.53032L13.25 8.06065L14.3107 6.99999L13.7803 6.46966L8.70711 1.39644Z"/>
            </svg>
          </button>
        </div>
      </div>
    </form>
  </main>
</div>

<script>
  // ── State Management ──────────────────────────────────────────
  let conversations = JSON.parse(localStorage.getItem('cb_convos') || '[]');
  let activeChatId = null;
  let currentAttachmentBase64 = null;
  let abortController = null;

  // DOM Elements
  const sidebar = document.getElementById('sidebar');
  const sidebarToggleBtn = document.getElementById('sidebar-toggle-btn');
  const sidebarNewChatBtn = document.getElementById('sidebar-new-chat-btn');
  const headerNewChatBtn = document.getElementById('header-new-chat-btn');
  const sidebarHistory = document.getElementById('sidebar-history');
  const messagesScroll = document.getElementById('messages-scroll');
  const messagesWrap = document.getElementById('messages-wrap');
  const suggestedActionsGrid = document.getElementById('suggested-actions-grid');
  const inputFormContainer = document.getElementById('input-form-container');
  const chatInput = document.getElementById('chat-input');
  const sendBtn = document.getElementById('send-btn');
  const stopBtn = document.getElementById('stop-btn');
  const attachBtn = document.getElementById('attach-btn');
  const filePicker = document.getElementById('file-picker');
  const attachmentsPreviewRow = document.getElementById('attachments-preview-row');
  const attachmentImgPreview = document.getElementById('attachment-img-preview');
  const attachmentDelBtn = document.getElementById('attachment-del-btn');
  const micBtn = document.getElementById('mic-btn');
  const themeToggleBtn = document.getElementById('theme-toggle-btn');
  const serverStatusDot = document.getElementById('server-status-dot');
  const headerStatusDot = document.getElementById('header-status-dot');
  const modelNameLabel = document.getElementById('model-name-label');

  // ── Theme Management ──────────────────────────────────────────
  function initTheme() {
    const saved = localStorage.getItem('cb_theme') || 'dark';
    if (saved === 'dark') document.documentElement.classList.add('dark');
    else document.documentElement.classList.remove('dark');
  }
  themeToggleBtn.onclick = () => {
    const isDark = document.documentElement.classList.contains('dark');
    if (isDark) {
      document.documentElement.classList.remove('dark');
      localStorage.setItem('cb_theme', 'light');
    } else {
      document.documentElement.classList.add('dark');
      localStorage.setItem('cb_theme', 'dark');
    }
  };
  initTheme();

  // ── Sidebar Toggle ────────────────────────────────────────────
  sidebarToggleBtn.onclick = () => {
    sidebar.classList.toggle('collapsed');
  };

  // ── Health Check ──────────────────────────────────────────────
  const apiBase = (window.location.origin && window.location.origin !== 'null' && !window.location.origin.startsWith('file:'))
    ? window.location.origin
    : 'http://127.0.0.1:11434';

  async function checkHealth() {
    try {
      const res = await fetch(`${apiBase}/health`, { signal: AbortSignal.timeout(3000) });
      if (res.ok) {
        const data = await res.json();
        serverStatusDot.className = 'status-dot';
        headerStatusDot.className = 'status-dot';
        modelNameLabel.textContent = data.model || 'FoundationModels';
      } else {
        serverStatusDot.className = 'status-dot offline';
        headerStatusDot.className = 'status-dot offline';
      }
    } catch (_) {
      serverStatusDot.className = 'status-dot offline';
      headerStatusDot.className = 'status-dot offline';
    }
  }
  checkHealth();
  setInterval(checkHealth, 15000);

  // ── History & Conversations ───────────────────────────────────
  function saveConversations() {
    localStorage.setItem('cb_convos', JSON.stringify(conversations));
    renderSidebarHistory();
  }

  function renderSidebarHistory() {
    sidebarHistory.innerHTML = '';
    if (conversations.length === 0) return;

    const titleEl = document.createElement('div');
    titleEl.className = 'history-group-title';
    titleEl.textContent = 'Today';
    sidebarHistory.appendChild(titleEl);

    conversations.forEach(c => {
      const item = document.createElement('div');
      item.className = 'history-item' + (c.id === activeChatId ? ' active' : '');
      item.innerHTML = `
        <span class="history-item-title">${escapeHtml(c.title || 'New Chat')}</span>
        <button class="history-item-del" title="Delete chat">&times;</button>
      `;
      item.querySelector('.history-item-title').onclick = () => loadChat(c.id);
      item.querySelector('.history-item-del').onclick = (e) => {
        e.stopPropagation();
        deleteChat(c.id);
      };
      sidebarHistory.appendChild(item);
    });
  }

  function startNewChat() {
    activeChatId = 'chat_' + Date.now();
    const newChat = { id: activeChatId, title: 'New Chat', messages: [] };
    conversations.unshift(newChat);
    saveConversations();
    loadChat(activeChatId);
  }

  function deleteChat(id) {
    conversations = conversations.filter(c => c.id !== id);
    if (activeChatId === id) {
      if (conversations.length > 0) loadChat(conversations[0].id);
      else startNewChat();
    } else {
      saveConversations();
    }
  }

  function loadChat(id) {
    activeChatId = id;
    const conv = conversations.find(c => c.id === id);
    if (!conv) return;

    messagesWrap.innerHTML = '';
    const hasMessages = conv.messages && conv.messages.length > 0;

    if (!hasMessages) {
      suggestedActionsGrid.style.display = 'grid';
      chatInput.classList.add('expanded-hero');
    } else {
      suggestedActionsGrid.style.display = 'none';
      chatInput.classList.remove('expanded-hero');
      conv.messages.forEach(m => {
        appendMessageDOM(m.role, m.content, m.image, false);
      });
    }

    renderSidebarHistory();
    messagesScroll.scrollTop = messagesScroll.scrollHeight;
  }

  sidebarNewChatBtn.onclick = startNewChat;
  headerNewChatBtn.onclick = startNewChat;

  // ── Auto-Resize Textarea ──────────────────────────────────────
  chatInput.addEventListener('input', () => {
    chatInput.style.height = 'auto';
    chatInput.style.height = Math.min(chatInput.scrollHeight, 240) + 'px';
    sendBtn.disabled = chatInput.value.trim().length === 0 && !currentAttachmentBase64;
  });

  chatInput.addEventListener('keydown', (e) => {
    if (e.key === 'Enter' && !e.shiftKey) {
      e.preventDefault();
      if (!sendBtn.disabled) submitChat();
    }
  });

  window.useSuggestedAction = function(text) {
    chatInput.value = text;
    chatInput.dispatchEvent(new Event('input'));
    submitChat();
  };

  // ── Attachments (Paperclip & Paste & Drag) ─────────────────────
  attachBtn.onclick = () => filePicker.click();
  filePicker.onchange = (e) => {
    const file = e.target.files[0];
    if (file) loadFile(file);
  };

  function loadFile(file) {
    if (!file || !file.type.startsWith('image/')) return;
    const reader = new FileReader();
    reader.onload = (e) => {
      currentAttachmentBase64 = e.target.result;
      attachmentImgPreview.src = currentAttachmentBase64;
      attachmentsPreviewRow.style.display = 'flex';
      sendBtn.disabled = false;
    };
    reader.readAsDataURL(file);
  }

  attachmentDelBtn.onclick = () => {
    currentAttachmentBase64 = null;
    filePicker.value = '';
    attachmentsPreviewRow.style.display = 'none';
    sendBtn.disabled = chatInput.value.trim().length === 0;
  };

  window.addEventListener('paste', (e) => {
    const items = (e.clipboardData || window.clipboardData).items;
    for (const item of items) {
      if (item.type.indexOf('image') === 0) {
        loadFile(item.getAsFile());
        break;
      }
    }
  });

  window.addEventListener('dragover', (e) => e.preventDefault());
  window.addEventListener('drop', (e) => {
    e.preventDefault();
    const file = e.dataTransfer.files[0];
    if (file) loadFile(file);
  });

  // ── Voice Input (Mic) ────────────────────────────────────────
  let mediaRecorder = null;
  let audioChunks = [];
  micBtn.onclick = async () => {
    if (mediaRecorder && mediaRecorder.state === 'recording') {
      mediaRecorder.stop();
      micBtn.classList.remove('recording');
      return;
    }
    try {
      const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
      mediaRecorder = new MediaRecorder(stream);
      audioChunks = [];
      mediaRecorder.ondataavailable = e => audioChunks.push(e.data);
      mediaRecorder.onstop = async () => {
        const audioBlob = new Blob(audioChunks, { type: 'audio/wav' });
        const formData = new FormData();
        formData.append('file', audioBlob, 'audio.wav');
        formData.append('model', 'whisper-1');
        try {
          const res = await fetch(`${apiBase}/v1/audio/transcriptions`, { method: 'POST', body: formData });
          if (res.ok) {
            const data = await res.json();
            if (data.text) {
              chatInput.value = (chatInput.value ? chatInput.value + ' ' : '') + data.text;
              chatInput.dispatchEvent(new Event('input'));
              chatInput.focus();
            }
          }
        } catch (_) {}
      };
      mediaRecorder.start();
      micBtn.classList.add('recording');
    } catch (_) {
      alert('Microphone not available');
    }
  };

  // ── Send Message & Stream ────────────────────────────────────
  async function submitChat() {
    const text = chatInput.value.trim();
    if (!text && !currentAttachmentBase64) return;

    if (!activeChatId) startNewChat();
    const conv = conversations.find(c => c.id === activeChatId);

    // Hide suggestions
    suggestedActionsGrid.style.display = 'none';
    chatInput.classList.remove('expanded-hero');

    const sentImg = currentAttachmentBase64;
    appendMessageDOM('user', text, sentImg, true);

    conv.messages.push({ role: 'user', content: text, image: sentImg });
    if (conv.messages.length === 1 && text) {
      conv.title = text.slice(0, 32) + (text.length > 32 ? '...' : '');
    }
    saveConversations();

    // Reset input
    currentAttachmentBase64 = null;
    attachmentsPreviewRow.style.display = 'none';
    chatInput.value = '';
    chatInput.style.height = 'auto';
    sendBtn.disabled = true;

    sendBtn.style.display = 'none';
    stopBtn.style.display = 'flex';

    // Assistant response row
    const assistantRow = appendMessageDOM('assistant', '', null, true);
    const contentEl = assistantRow.querySelector('.assistant-content');
    const actionsEl = assistantRow.querySelector('.message-actions');

    const cursor = document.createElement('span');
    cursor.className = 'cursor';
    contentEl.appendChild(cursor);

    abortController = new AbortController();
    const startTime = Date.now();

    try {
      const payloadMessages = conv.messages.map(m => {
        if (m.image) {
          return {
            role: m.role,
            content: [
              { type: 'text', text: m.content || '' },
              { type: 'image_url', image_url: { url: m.image } }
            ]
          };
        }
        return { role: m.role, content: m.content };
      });

      const res = await fetch(`${apiBase}/v1/chat/completions`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          model: 'sayitdev-on-device',
          stream: true,
          messages: payloadMessages
        }),
        signal: abortController.signal
      });

      if (!res.ok) {
        const err = await res.json().catch(() => ({}));
        contentEl.innerHTML = `<span style="color:hsl(var(--destructive));">Error (${res.status}): ${escapeHtml(err.error?.message || res.statusText)}</span>`;
        cursor.remove();
        return;
      }

      const reader = res.body.getReader();
      const decoder = new TextDecoder();
      let fullText = '';
      let buffer = '';

      while (true) {
        const { done, value } = await reader.read();
        if (done) break;

        buffer += decoder.decode(value, { stream: true });
        const lines = buffer.split('\n');
        buffer = lines.pop();

        for (const line of lines) {
          const trimmed = line.trim();
          if (trimmed.startsWith('data: ') && trimmed !== 'data: [DONE]') {
            try {
              const json = JSON.parse(trimmed.slice(6));
              const delta = json.choices[0]?.delta?.content || '';
              fullText += delta;
              renderMarkdown(contentEl, fullText);
              contentEl.appendChild(cursor);
              messagesScroll.scrollTop = messagesScroll.scrollHeight;
            } catch (_) {}
          }
        }
      }

      cursor.remove();
      conv.messages.push({ role: 'assistant', content: fullText });
      saveConversations();

      const elapsed = ((Date.now() - startTime) / 1000).toFixed(1);
      actionsEl.innerHTML = `
        <span>${elapsed}s</span>
        <span>&bull;</span>
        <button class="action-btn" onclick="navigator.clipboard.writeText(decodeURIComponent('${encodeURIComponent(fullText)}')); this.innerText='Copied!'; setTimeout(()=>this.innerText='Copy',1500)">
          <span>📋</span> Copy
        </button>
        <button class="action-btn" onclick="speakMessage(decodeURIComponent('${encodeURIComponent(fullText)}'))">
          <span>🔊</span> Listen
        </button>
      `;

    } catch (err) {
      cursor.remove();
      if (err.name !== 'AbortError') {
        contentEl.innerHTML = `<span style="color:hsl(var(--destructive));">Connection error: ${escapeHtml(err.message)}</span>`;
      }
    } finally {
      sendBtn.style.display = 'flex';
      stopBtn.style.display = 'none';
      abortController = null;
    }
  }

  stopBtn.onclick = () => {
    if (abortController) abortController.abort();
  };

  // ── Render Message (message.tsx) ─────────────────────────────
  function appendMessageDOM(role, text, imageSrc, scroll) {
    const row = document.createElement('div');
    row.className = `message-row ${role}`;

    if (role === 'assistant') {
      const avatar = document.createElement('div');
      avatar.className = 'bot-avatar';
      // QuestionIcon from icons.tsx
      avatar.innerHTML = `
        <svg height="18" viewBox="0 0 16 16" width="18" fill="currentColor">
          <path fill-rule="evenodd" clip-rule="evenodd" d="M8 16C12.4183 16 16 12.4183 16 8C16 3.58172 12.4183 0 8 0C3.58172 0 0 3.58172 0 8C0 12.4183 3.58172 16 8 16ZM8.75 11C8.75 11.4142 8.41421 11.75 8 11.75C7.58579 11.75 7.25 11.4142 7.25 11C7.25 10.5858 7.58579 10.25 8 10.25C8.41421 10.25 8.75 10.5858 8.75 11ZM8 4C6.61929 4 5.5 5.11929 5.5 6.5H7C7 5.94772 7.44772 5.5 8 5.5C8.55228 5.5 9 5.94772 9 6.5C9 7.05228 8.55228 7.5 8 7.5C7.58579 7.5 7.25 7.83579 7.25 8.25V9.5H8.75V8.91421C9.88071 8.57871 10.75 7.53553 10.75 6.5C10.75 5.11929 9.63071 4 8 4Z"/>
        </svg>
      `;
      row.appendChild(avatar);
    }

    const col = document.createElement('div');
    col.className = 'message-content-col';

    if (imageSrc) {
      const img = document.createElement('img');
      img.src = imageSrc;
      img.className = 'message-attachment-thumb';
      col.appendChild(img);
    }

    if (role === 'user') {
      const bubble = document.createElement('div');
      bubble.className = 'user-bubble';
      bubble.textContent = text;
      col.appendChild(bubble);
    } else {
      const content = document.createElement('div');
      content.className = 'assistant-content prose';
      renderMarkdown(content, text);
      col.appendChild(content);

      const actions = document.createElement('div');
      actions.className = 'message-actions';
      if (text) {
        actions.innerHTML = `
          <button class="action-btn" onclick="navigator.clipboard.writeText(decodeURIComponent('${encodeURIComponent(text)}')); this.innerText='Copied!'; setTimeout(()=>this.innerText='Copy',1500)">
            <span>📋</span> Copy
          </button>
          <button class="action-btn" onclick="speakMessage(decodeURIComponent('${encodeURIComponent(text)}'))">
            <span>🔊</span> Listen
          </button>
        `;
      }
      col.appendChild(actions);
    }

    row.appendChild(col);
    messagesWrap.appendChild(row);

    if (scroll) messagesScroll.scrollTop = messagesScroll.scrollHeight;
    return row;
  }

  // ── Markdown Parser ──────────────────────────────────────────
  function renderMarkdown(container, md) {
    if (!md) { container.innerHTML = ''; return; }

    let html = md.replace(/```([a-zA-Z0-9_-]*)\n([\s\S]*?)```/g, (match, lang, code) => {
      const cleanCode = code.trim();
      return `<pre><button class="code-copy-btn" onclick="navigator.clipboard.writeText(this.nextElementSibling.innerText); this.innerText='Copied!'; setTimeout(()=>this.innerText='Copy',1500)">Copy</button><code>${escapeHtml(cleanCode)}</code></pre>`;
    });

    html = html.replace(/^### (.*$)/gim, '<h3>$1</h3>');
    html = html.replace(/^## (.*$)/gim, '<h2>$1</h2>');
    html = html.replace(/^# (.*$)/gim, '<h1>$1</h1>');
    html = html.replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>');
    html = html.replace(/\*(.*?)\*/g, '<em>$1</em>');
    html = html.replace(/`([^`]+)`/g, '<code>$1</code>');
    html = html.replace(/^\s*[-*]\s+(.*)$/gim, '<li>$1</li>');
    html = html.replace(/(<li>[\s\S]*?<\/li>)/g, '<ul>$1</ul>');
    html = html.replace(/\n\n/g, '<p></p>');
    html = html.replace(/\n/g, '<br>');

    container.innerHTML = html;
  }

  function escapeHtml(str) {
    return (str || '').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
  }

  window.speakMessage = async function(text) {
    if (!text) return;
    try {
      const res = await fetch(`${apiBase}/v1/audio/speech`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ input: text, voice: 'personal' })
      });
      if (res.ok) {
        const blob = await res.blob();
        const audio = new Audio(URL.createObjectURL(blob));
        audio.play();
        return;
      }
    } catch (_) {}

    if ('speechSynthesis' in window) {
      window.speechSynthesis.cancel();
      window.speechSynthesis.speak(new SpeechSynthesisUtterance(text));
    }
  };

  // ── Init ─────────────────────────────────────────────────────
  if (conversations.length === 0) {
    startNewChat();
  } else {
    loadChat(conversations[0].id);
  }
</script>
</body>
</html>
