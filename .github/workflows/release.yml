name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: macos-26
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Select latest Xcode
        run: |
          latest=$(ls -d /Applications/Xcode_*.app 2>/dev/null | sort -V | tail -1)
          if [[ -n "$latest" ]]; then
            echo "Selecting $latest"
            sudo xcode-select -s "$latest/Contents/Developer"
          fi
          echo "Active SDK: $(xcrun --show-sdk-version)"
          echo "Swift: $(swift --version 2>&1 | head -1)"

      - name: Build release binary
        run: make build

      - name: Unit tests
        run: swift run sayitdev-tests

      - name: Package release asset
        run: make package-release-asset

      - name: Generate checksum
        run: |
          asset=$(make print-release-asset)
          shasum -a 256 "$asset" > "$asset.sha256"
          echo "ASSET=$asset" >> $GITHUB_ENV

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          version="${GITHUB_REF#refs/tags/}"
          notes="## What's Changed"$'\n\n'
          prev_tag=$(git tag --sort=-v:refname | grep -Fxv "$version" | head -1)
          if [ -n "$prev_tag" ]; then
            notes+=$(git log --oneline "$prev_tag"..HEAD -- | sed 's/^/- /')
          fi
          notes+=$'\n\n'"---"$'\n'
          notes+="Install: \`brew tap innovatorved/tap && brew install innovatorved/tap/dev\`"$'\n'
          notes+="Upgrade: \`brew upgrade dev\`"

          gh release create "$version" "${{ env.ASSET }}" "${{ env.ASSET }}.sha256" \
            --title "$version" \
            --notes "$notes"
